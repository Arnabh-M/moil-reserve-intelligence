# Carried over from the Replit monorepo root (temp-replit-import/pnpm-workspace.yaml)
# so that the `catalog:` version specifiers already present in package.json keep
# resolving now that this app is a standalone project rather than a workspace member.
#
# Deliberately NOT carried over: the monorepo's `overrides:` block. Those entries
# excluded every non-linux-x64 native binary ("replit uses linux-x64 only"),
# including @rollup/rollup-win32-x64-msvc, @tailwindcss/oxide-win32-x64-msvc,
# @esbuild/win32-x64 and lightningcss-win32-x64-msvc - the exact packages Vite,
# Rollup and Tailwind need to run on Windows. Keeping them would make the app
# impossible to start locally. The remaining overrides were drizzle-kit pins for
# lib/db, which is not part of this app.

# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Requires that any npm package version must have been published for at least
# 1 day (1440 minutes) before pnpm will allow installing it. Malicious npm
# releases are usually discovered and pulled within hours, so a 1-day delay is
# a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING.
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Published by Replit and trusted - the supply-chain vector this guards
  # against does not apply to these.
  - '@replit/*'
  - stripe-replit-sync

packages:
  - .

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

allowBuilds:
  esbuild: true
