<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <!-- Mineral Amber/Gold Gradient for Left Wing -->
    <linearGradient id="goldMineral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Crystal Teal Gradient for Right Wing -->
    <linearGradient id="crystalTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7df9ff" />
      <stop offset="60%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Orbit Stroke -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Dark Base Squircle -->
  <rect width="36" height="36" rx="8" fill="#07090e" />
  <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="7.25" stroke="#00f0ff" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Left Mineral Wing of M -->
  <polygon points="5,29 13.5,7 18,18 10,29" fill="url(#goldMineral)" />
  <!-- Mineral Contours -->
  <path d="M7,28 Q10,22 13,12" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.85" />
  <path d="M8.5,28 Q11.5,23 14,16" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.7" />

  <!-- Right Crystal Wing of M -->
  <polygon points="18,18 22.5,7 31,29 22.5,29 22.5,20 18,18" fill="url(#crystalTeal)" fill-opacity="0.92" />
  
  <!-- Right Wing 4-point Star Highlight -->
  <path d="M26.5,21 L27.2,23.5 L29.7,24.2 L27.2,24.9 L26.5,27.4 L25.8,24.9 L23.3,24.2 L25.8,23.5 Z" fill="#ffffff" opacity="0.95" />

  <!-- Orbiting Elliptical Arc -->
  <path d="M12,15 C17,7 28,6 30,12 C32,18 23,24 16,21" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Satellite at Orbit Apex -->
  <rect x="27.5" y="6" width="3" height="2" rx="0.5" fill="#ffffff" transform="rotate(35 29 7)" />
  <line x1="25.5" y1="5" x2="32.5" y2="9" stroke="#7df9ff" stroke-width="0.8" stroke-linecap="round" />
</svg>