services:
  postgres:
    # PostGIS base + pgvector (see Dockerfile.postgres). Rebuild after
    # pulling a change to that file: `docker compose up -d --build`.
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: oresight-postgres:16-3.4-pgvector
    container_name: oresight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oresight
      POSTGRES_PASSWORD: oresight
      POSTGRES_DB: oresight
    ports:
      # Standard 5432 port mapped to host 5432, aligning with .env.example
      - "5432:5432"
    volumes:
      - oresight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oresight -d oresight"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    container_name: oresight-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/oresight123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - oresight_neo4j_data:/data
      - oresight_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p oresight123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oresight-api:latest
    container_name: oresight-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+psycopg://oresight:oresight@postgres:5432/oresight
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=oresight123
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  oresight_postgres_data:
  oresight_neo4j_data:
  oresight_neo4j_logs:
